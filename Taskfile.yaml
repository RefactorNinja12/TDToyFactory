# Local dev tasks. Run `task` for the list.
#   task test               fast tests (~8 s)
#   task test -- Farming    fast tests whose name contains "Farming"
#   task check              lint + copy-paste check + all tests (run before committing)
# Every task prints only problems plus one summary line (PASS/FAIL, LINT OK/FAIL, BUILD OK/FAIL),
# so the output stays small enough to paste into or read from an AI session.
version: "3"

silent: true

vars:
  PS: powershell -NoProfile -ExecutionPolicy Bypass -File

tasks:
  default:
    desc: List the tasks
    cmds:
      - task --list

  test:
    desc: "Fast tests (filter: task test -- Farming)"
    cmds:
      - "{{.PS}} tests/run.ps1 {{.CLI_ARGS}}"

  test:slow:
    desc: Slow tests (whole matches, balance)
    cmds:
      - "{{.PS}} tests/run.ps1 -Slow {{.CLI_ARGS}}"

  test:report:
    desc: Slow tests plus the balance numbers each one measured
    cmds:
      - "{{.PS}} tests/run.ps1 -Slow -Report {{.CLI_ARGS}}"

  test:changed:
    desc: Only the tests for what changed since the last commit (+ golden match for Sim changes)
    cmds:
      - "{{.PS}} tests/changed.ps1"

  test:timing:
    desc: Every test, plus the 10 slowest ones
    cmds:
      - "{{.PS}} tests/run.ps1 -All -Timing {{.CLI_ARGS}}"

  coverage:
    desc: Line coverage of Sim and UI (summary + least covered files; slow, ~100 s)
    cmds:
      - "{{.PS}} tests/coverage.ps1 {{.CLI_ARGS}}"

  test:all:
    desc: Every test
    cmds:
      - "{{.PS}} tests/run.ps1 -All {{.CLI_ARGS}}"

  build:
    desc: Build the Godot C# project
    cmds:
      - "{{.PS}} tests/build.ps1"

  lint:
    desc: Formatting (.editorconfig), code style and analyzers, check only
    cmds:
      - "{{.PS}} tests/lint.ps1"

  export:
    desc: "Windows/Linux/macOS builds as one zip each in builds/ (needs Godot .NET export templates)"
    cmds:
      - "{{.PS}} tests/export.ps1"

  mp:smoke:
    desc: "Two headless games (host + client over localhost, bots) must end with equal checksums (~40 s)"
    cmds:
      - "{{.PS}} tests/mp_smoke.ps1"

  dupes:
    desc: "Copy-paste check (jscpd via npx, .jscpd.json): any repeated block of 50+ tokens fails"
    cmds:
      - "{{.PS}} tests/dupes.ps1"

  fmt:
    desc: Apply the automatic lint fixes
    cmds:
      - "{{.PS}} tests/lint.ps1 -Fix"

  check:
    desc: Lint, then all tests (before committing)
    cmds:
      - task: lint
      - task: dupes
      - task: test:all
